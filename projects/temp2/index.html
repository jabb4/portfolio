<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Temp2</title>
    <meta
      name="description"
      content="Project page for Temp2."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../assets/css/site.css" />
  </head>
  <body data-page="project" data-project-slug="temp2">
    <div class="page-shell">
      <header class="site-header">
        <a class="brand" id="brand-link" href="../../">Portfolio</a>
        <nav class="site-nav" aria-label="Primary navigation">
          <div id="project-nav"></div>
          <a class="nav-link" href="#contact">Contact</a>
        </nav>
      </header>

      <main class="page-content">
        <section class="project-hero">
          <a class="back-link" id="back-link" href="../../#projects">Back to featured projects</a>
          <div class="project-hero-top">
            <p class="section-label" id="project-label"></p>
            <span class="project-year" id="project-year"></span>
          </div>
          <h1 id="project-title"></h1>
          <p class="project-summary" id="project-summary"></p>
          <div class="tag-list" id="project-stack"></div>
          <div class="project-links" id="project-links"></div>
        </section>

        <section class="content-section">
          <div class="detail-grid" id="project-sections"></div>
        </section>

        <section class="content-section">
          <div class="simple-panel">
            <p class="section-label">Highlights</p>
            <ul class="highlight-list" id="project-highlights"></ul>
          </div>
        </section>

        <section class="content-section" id="contact">
          <div class="simple-panel contact-panel">
            <p class="section-label">Contact</p>
            <h2 id="contact-title"></h2>
            <p class="contact-copy" id="contact-copy"></p>
            <div class="contact-links" id="contact-links"></div>
          </div>
        </section>
      </main>
    </div>

    <script src="../../assets/js/content.js"></script>
    <script src="../../assets/js/site.js"></script>
  </body>
</html>
